[package]
name = "bls12_381"
authors = [
    "Sean Bowe <ewillbefull@gmail.com>",
    "Jack Grigg <thestr4d@gmail.com>",
]
edition = "2021"
version = "0.8.0"
description = "Implementation of the BLS12-381 pairing-friendly elliptic curve construction"
documentation = "https://docs.rs/bls12_381/"
homepage = "https://github.com/brevis-network/bls12_381"
license = "MIT/Apache-2.0"
repository = "https://github.com/brevis-network/bls12_381"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]

[dev-dependencies]
csv = ">= 1.0, < 1.2" # csv 1.2 has MSRV 1.60
criterion = "0.3"
hex-literal = "0.3"
rand_xorshift = "0.3"
sha2 = "0.10"
sha3 = "0.10"

[[bench]]
name = "groups"
harness = false
required-features = ["groups"]

[[bench]]
name = "hash_to_curve"
harness = false
required-features = ["experimental"]

[dependencies.cfg-if]
version = "1.0.0"
default-features = false

[dependencies.digest]
version = "0.9"
optional = true
default-features = false

[dependencies.ff]
version = "0.13"
default-features = false

[dependencies.group]
version = "0.13"
default-features = false
optional = true

[dependencies.pairing]
version = "0.23"
optional = true
default-features = false

[dependencies.rand_core]
version = "0.6"
default-features = false

[dependencies.subtle]
version = "2.2.1"
default-features = false

[dependencies.zeroize]
version = "1.4"
default-features = false
optional = true

[dependencies.hex]
version = "0.4"
default-features = false
features = ["alloc"]
optional = true

[target.'cfg(target_os = "zkvm")'.dependencies]
pico-sdk = { git = "https://github.com/brevis-network/brevis-vm.git", branch = "cli", default-features = false }


[features]
default = ["groups", "pairings", "alloc", "bits"]
bits = ["ff/bits"]
groups = ["group"]
pairings = ["groups", "pairing"]
alloc = ["group/alloc"]
experimental = ["digest", "hex"]
nightly = ["subtle/nightly"]